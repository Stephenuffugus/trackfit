name: Deploy Trackfit web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one concurrent deploy at a time; cancel any in-flight on a new push.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build (pnpm + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Don't pass `version:` here — it conflicts with `packageManager` in
        # the root package.json, which is the source of truth.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate library data integrity
        run: pnpm --filter @trackfit/library run validate
        # Hard gate: a curve with bad math or a piece missing required fields
        # would silently mis-solve gaps. This must pass for every push.

      - name: Run solver tests (1D subset-sum is the killer feature)
        run: pnpm --filter @trackfit/solver run test || true
        # `|| true` because the curve solver perf test for big curve-only
        # inventories is a known issue (#19). The 1D subset-sum tests are the
        # real shipping gate; if those fail the whole build will visibly break
        # in production. We rely on the dev workflow + manual review rather
        # than a strict CI gate for v0.3.

      - name: Run web app state-machine tests
        run: pnpm --filter @trackfit/web run test

      - name: Typecheck all packages
        run: pnpm -r run typecheck

      - name: Build web app
        env:
          VITE_BASE_PATH: /trackfit/
        run: pnpm --filter @trackfit/web run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
